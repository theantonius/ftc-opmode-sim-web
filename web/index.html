<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FTC OpMode Sim</title>
<meta name="description" content="Write real FTC SDK OpMode code in the browser and watch a simulated robot and Driver Station.">
<link rel="stylesheet" href="css/style.css?v=20261112g">
<script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
<script src="vendor/p5.min.js"></script>
</head>
<body>
<div id="stage">

  <!-- OnBot Java-style editor, 680 x 720 (Figma "Editor", node 3:2) -->
  <div id="editor">
    <div class="topbar">
      <button class="tab-mode tab-blocks" type="button" data-mode="blocks" title="Build your OpMode with blocks">Blocks</button>
      <button class="tab-mode tab-onbot active" type="button" data-mode="java" title="Write your OpMode in Java">OnBotJava</button>
    </div>

    <div class="files">
      <div class="toolbar">
        <img src="assets/icons/settings.svg" alt="" title="Settings (not in sim)">
        <img src="assets/icons/undo.svg" alt="Undo" title="Undo" class="undo">
        <img src="assets/icons/addfile.svg" alt="" title="New file (not in sim)">
        <img src="assets/icons/upload.svg" alt="" title="Upload files (not in sim)">
        <img src="assets/icons/collapse.svg" alt="" title="Collapse (not in sim)">
      </div>
      <div class="files-title">Project Files</div>
      <div class="pkg"><span class="caret">▾</span>org.firstinspires.</div>
      <div class="pkg2">    ftc.teamcode</div>
      <div class="selected"><span class="file-name">FourMotorTest.java</span></div>

      <label class="examples-label" for="examples">Examples</label>
      <select class="examples" id="examples" title="Replace the editor with an example OpMode (Cmd+Z brings yours back)">
        <option value="" selected disabled>Load an example…</option>
        <option value="FourMotorTest">4 Motor Test</option>
        <option value="FourMotorTestCompileError">4 Motor Test (compile error)</option>
        <option value="StuckLoopDemo">Stuck loop: while (true)</option>
        <option value="MecanumPatterns">Mecanum patterns</option>
        <optgroup label="Blocks">
          <option value="blocks:DriveForward">Blocks: Drive Forward</option>
          <option value="blocks:MecanumSquare">Blocks: Mecanum Square</option>
        </optgroup>
      </select>

      <div class="file-actions">
        <button class="download" type="button" title="Save your OpMode as a .java file for a real robot">Download .java</button>
        <button class="upload" type="button" title="Replace the OpMode with a .java file">Upload .java</button>
        <input class="upload-input" type="file" accept=".java,text/x-java,text/plain" hidden>
      </div>
    </div>

    <div class="tabs"><div class="tab-active"><span class="file-name">FourMotorTest.java</span>  ×</div></div>

    <div class="code"></div>

    <!-- Blocks mode (layout like FTC Blocks). The Blockly workspace itself is #blockly-host, outside the stage. -->
    <div class="bk">
      <div class="bk-toolbar">
        <button class="bk-save" type="button" title="Save and build this Op Mode so it shows up on the Driver Station">Save Op Mode</button>
        <button class="bk-convert" type="button" title="Copy the generated Java into OnBotJava mode to keep editing it">Convert to Java</button>
        <button class="bk-download" type="button" title="Save the generated Java as a .java file for a real robot">Download .java</button>
        <select class="examples bk-examples" title="Load an example">
          <option value="" selected disabled>Examples…</option>
          <option value="blocks:DriveForward">Blocks: Drive Forward</option>
          <option value="blocks:MecanumSquare">Blocks: Mecanum Square</option>
          <option value="FourMotorTest">Java: 4 Motor Test</option>
          <option value="MecanumPatterns">Java: Mecanum patterns</option>
        </select>
        <span class="bk-status"></span>
      </div>
      <div class="bk-namebar">
        <label>Op Mode Name: <input class="bk-name" type="text" maxlength="40" spellcheck="false"></label>
        <select class="bk-kind"><option>TeleOp</option><option>Autonomous</option></select>
        <label class="bk-showjava-label"><input class="bk-showjava" type="checkbox"> Show Java</label>
      </div>
      <div class="bk-java">
        <div class="bk-java-title">Java Code:</div>
        <div class="gen"></div>
      </div>
    </div>

    <div class="messages">
      <div class="msg-label">Messages</div>
      <div class="msg-title"></div>
      <div class="msg-body"></div>
      <button class="build" type="button" title="Save and compile">
        <img src="assets/icons/wrench.svg" alt=""><span class="build-label">Build Everything</span>
      </button>
    </div>
  </div>

  <!-- Robot view (top) + Driver Station (bottom), 600 x 720, drawn with p5.js -->
  <div id="sim"></div>
</div>
<!-- Blockly lives outside the scaled stage (it doesn't support CSS-scaled parents); main.js keeps it over the code area -->
<div id="blockly-host"></div>
<script type="module" src="js/main.js?v=20261112g"></script>
</body>
</html>
