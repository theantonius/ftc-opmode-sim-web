<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FTC OpMode Sim web - CheerpJ spike</title>
<script>
window.T0 = performance.now();
// Count bytes per host for every fetch/XHR (cross-origin Resource Timing hides sizes).
window.NET = {};
(function () {
  const add = (url, n) => {
    try {
      const h = new URL(url, location.href).host;
      const e = (window.NET[h] = window.NET[h] || { requests: 0, bytes: 0 });
      e.requests++; e.bytes += n;
    } catch (_) {}
  };
  const f = window.fetch;
  window.fetch = async function (input, init) {
    const r = await f.apply(this, arguments);
    const url = typeof input === "string" ? input : input.url;
    r.clone().arrayBuffer().then((b) => add(url, b.byteLength), () => add(url, 0));
    return r;
  };
  const open = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (m, url) {
    this.addEventListener("loadend", () => {
      let n = 0;
      try {
        const r = this.response;
        n = r == null ? 0 : r.byteLength != null ? r.byteLength : r.size != null ? r.size : String(r).length;
      } catch (_) {}
      add(url, n);
    });
    return open.apply(this, arguments);
  };
})();
</script>
<script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
</head>
<body>
<h1>CheerpJ spike</h1>
<p>Step 1 test page: compile and run a real FTC OpMode in the browser. No styling on purpose.</p>
<p>Built with <a href="https://cheerpj.com/">CheerpJ</a>.</p>

<p id="load">Loading CheerpJ...</p>

<p>
  OpMode:
  <select id="pick">
    <option value="FourMotorTest">FourMotorTest.java (unedited)</option>
    <option value="Broken">FourMotorTest.java, broken copy (2 errors: lines 90, 93)</option>
    <option value="MirrorTest">test-opmodes/MirrorTest.java</option>
    <option value="BadNameTest">test-opmodes/BadNameTest.java</option>
    <option value="StopTest">StopTest (loop + sleep, for STOP timing)</option>
    <option value="Stuck">Stuck (while (true) {} ignores STOP)</option>
    <option value="StuckSleep">StuckSleep (while (true) sleep(10); ignores STOP)</option>
  </select>
  <button id="loadBtn">Load into editor</button>
</p>
<textarea id="src" rows="20" cols="100" spellcheck="false"></textarea>
<p>
  <button id="build" disabled>Build Everything</button>
  <button id="ds" disabled>INIT</button>
  <button id="stop" disabled>STOP</button>
  <button id="auto" disabled>Run all checks</button>
  <button id="autoStuck" disabled>Run stuck check (may freeze the tab)</button>
</p>

<h2>Messages</h2>
<pre id="messages"></pre>

<h2>Driver Station</h2>
<pre id="dsInfo"></pre>
<pre id="telemetry" style="border:1px solid #888; height:200px; overflow:auto"></pre>

<h2>Motors</h2>
<canvas id="cv" width="600" height="120" style="border:1px solid #888"></canvas>
<pre id="motors"></pre>
<p id="fps"></p>

<h2>Checks</h2>
<pre id="checks"></pre>

<h2>Timing and network</h2>
<pre id="timing"></pre>

<h2>Log</h2>
<pre id="log"></pre>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const log = (s) => { $("log").textContent += s + "\n"; console.log("[spike]", s); };
const sleepMs = (ms) => new Promise((r) => setTimeout(r, ms));
const params = new URLSearchParams(location.search);

// Paths: CheerpJ maps /app/ to this server's root.
const base = location.pathname.replace(/[^/]*$/, ""); // e.g. /spike/
const JAVA = Number(params.get("java") || 17); // 17: CheerpJ's runtime includes javac. 8: needs tools.jar and fails (see Status)
// Java 8 runtime has no javac: add the JDK 8 tools.jar. Java 11+ runtimes include jdk.compiler.
const CP = "/app" + base + "sim.jar" + (JAVA === 8 ? ":/app" + base + "tools.jar" : "");

// CheerpJ library mode allows one Java call at a time from JS: queue them all.
let jq = Promise.resolve();
let jbusy = 0;
function J(fn) {
  jbusy++;
  const p = jq.then(fn);
  jq = p.catch(() => {}).then(() => { jbusy--; });
  return p;
}
const timing = { cdnLoaderMs: null };
let Bridge = null;
let lib = null;
let snap = null;
let snapSeq = 0; // increments on every fresh snapshot
let fileName = "FourMotorTest.java";
let builtName = null;
let buildCount = 0;

// ---------- sources ----------
const extra = {
  StopTest: `package org.firstinspires.ftc.teamcode;

import com.qualcomm.robotcore.eventloop.opmode.LinearOpMode;
import com.qualcomm.robotcore.eventloop.opmode.Autonomous;
import com.qualcomm.robotcore.hardware.DcMotor;

@Autonomous(name = "Stop Test")
public class StopTest extends LinearOpMode {
    @Override
    public void runOpMode() {
        DcMotor fr = hardwareMap.get(DcMotor.class, "frontRight");
        waitForStart();
        int n = 0;
        while (opModeIsActive()) {
            fr.setPower(0.5);
            telemetry.addData("Loop", n++);
            telemetry.update();
            sleep(50);
        }
    }
}
`,
  Stuck: `package org.firstinspires.ftc.teamcode;

import com.qualcomm.robotcore.eventloop.opmode.LinearOpMode;
import com.qualcomm.robotcore.eventloop.opmode.TeleOp;
import com.qualcomm.robotcore.hardware.DcMotor;

@TeleOp(name = "Stuck")
public class Stuck extends LinearOpMode {
    @Override
    public void runOpMode() {
        DcMotor fl = hardwareMap.get(DcMotor.class, "frontLeft");
        waitForStart();
        fl.setPower(1.0);
        telemetry.addLine("spinning forever");
        telemetry.update();
        while (true) {}
    }
}
`,
  StuckSleep: `package org.firstinspires.ftc.teamcode;

import com.qualcomm.robotcore.eventloop.opmode.LinearOpMode;
import com.qualcomm.robotcore.eventloop.opmode.TeleOp;
import com.qualcomm.robotcore.hardware.DcMotor;

@TeleOp(name = "Stuck Sleep")
public class StuckSleep extends LinearOpMode {
    @Override
    public void runOpMode() {
        DcMotor fl = hardwareMap.get(DcMotor.class, "frontLeft");
        waitForStart();
        fl.setPower(1.0);
        telemetry.addLine("sleeping forever");
        telemetry.update();
        while (true) { sleep(10); }
    }
}
`,
};

async function source(key) {
  if (extra[key]) return { name: key + ".java", text: extra[key] };
  if (key === "Broken") {
    const t = await (await fetch("opmodes/FourMotorTest.java")).text();
    const b = t.replace("stopAllMotors();\n\n                DcMotor motor", "stopAllMotorz();\n\n                DcMotor motor")
               .replace("motor.setPower(TEST_POWER);", "motor.setPowr(TEST_POWER);");
    return { name: "FourMotorTest.java", text: b };
  }
  return { name: key + ".java", text: await (await fetch("opmodes/" + key + ".java")).text() };
}

async function loadPick(key) {
  const s = await source(key);
  fileName = s.name;
  $("src").value = s.text;
}

// ---------- build ----------
async function build() {
  const t0 = performance.now();
  const r = JSON.parse(await J(() => Bridge.build(fileName, $("src").value)));
  const ms = Math.round(performance.now() - t0);
  buildCount++;
  if (buildCount === 1) timing.firstCompileMs = ms;
  else if (buildCount === 2) timing.secondCompileMs = ms;
  timing.lastCompileMs = ms;
  timing.lastCompileJavaMs = r.ms;
  const out = [];
  if (r.ok) {
    builtName = r.name;
    out.push("Build succeeded!");
    out.push('OpMode "' + r.name + '" is now available on the Driver Station.');
  } else {
    const n = r.problems.length;
    out.push("Build failed: " + n + " error" + (n === 1 ? "" : "s"));
    for (const p of r.problems) out.push(p.line > 0 ? "Line " + p.line + ": " + p.message : p.message);
  }
  $("messages").textContent = out.join("\n") + "\n(" + ms + " ms in page, " + r.ms + " ms in Java)";
  r.kindText = r.kind;
  if (r.ok) $("dsInfo").dataset.kind = r.kind;
  showTiming();
  return r;
}

// ---------- Driver Station button: INIT -> PLAY -> STOP ----------
function dsButtonLabel() {
  if (!snap) return "INIT";
  if (snap.state === "INIT") return "PLAY";
  if (snap.state === "RUNNING") return "STOP";
  return "INIT";
}
async function dsPress() {
  const l = dsButtonLabel();
  if (l === "INIT") await J(() => Bridge.init());
  else if (l === "PLAY") await J(() => Bridge.play());
  else await J(() => Bridge.stop());
}

// ---------- frame loop: draw every frame, poll Java when free ----------
let pending = false;
let frames = 0, lastSec = performance.now(), fpsNow = 0;
const fpsLog = []; // fps per second
let snapLatency = [];
let angle = 0, lastFrame = performance.now(), worstGap = 0;

async function pollJava() {
  if (!Bridge || pending || jbusy > 0) return;
  pending = true;
  const t0 = performance.now();
  try {
    snap = JSON.parse(await J(() => Bridge.snapshot()));
    snapSeq++;
    snapLatency.push(performance.now() - t0);
    if (snapLatency.length > 120) snapLatency.shift();
    for (const e of snap.events) log("event: " + e);
  } finally {
    pending = false;
  }
}

function frame(now) {
  const gap = now - lastFrame;
  lastFrame = now;
  if (gap > worstGap) worstGap = gap;
  frames++;
  if (now - lastSec >= 1000) {
    fpsNow = Math.round(frames * 1000 / (now - lastSec));
    fpsLog.push({ fps: fpsNow, worstGap: Math.round(worstGap), state: snap ? snap.state : "-" });
    if (fpsLog.length > 600) fpsLog.shift();
    frames = 0; lastSec = now; worstGap = 0;
    const lat = snapLatency.length ? (snapLatency.reduce((a, b) => a + b, 0) / snapLatency.length).toFixed(1) : "-";
    $("fps").textContent = "Page redraw: " + fpsNow + " fps. Java snapshot call: avg " + lat + " ms.";
  }
  pollJava();
  draw();
  requestAnimationFrame(frame);
}

function draw() {
  const c = $("cv").getContext("2d");
  c.clearRect(0, 0, 600, 120);
  // spinner proves the page keeps redrawing
  angle += 0.1;
  c.beginPath(); c.moveTo(50, 60); c.lineTo(50 + 35 * Math.cos(angle), 60 + 35 * Math.sin(angle)); c.stroke();
  if (!snap) return;
  snap.motors.forEach((m, i) => {
    const x = 130 + i * 115;
    c.strokeRect(x, 20, 90, 80);
    const h = Math.abs(m.spin) * 38;
    c.fillStyle = m.spin > 0 ? "#2a2" : "#58A6FF";
    if (m.spin > 0) c.fillRect(x + 35, 60 - h, 20, h); else c.fillRect(x + 35, 60, 20, h);
    c.fillStyle = "#000";
    c.fillText(m.name + " [" + m.port + "]", x + 4, 14);
  });
  const st = { IDLE: builtName ? "selected" : "-", INIT: "Initialized", RUNNING: "Running",
               STOPPED: snap.error ? "Stopped (error)" : "Stopped" }[snap.state];
  $("dsInfo").textContent = ($("dsInfo").dataset.kind || "") + " " + (builtName || "No Op Mode") +
      "   config SimRobot   status: " + st + "   (Java state " + snap.state + ")";
  $("telemetry").textContent = snap.error ? "Error: " + snap.error : snap.telemetry.join("\n");
  $("motors").textContent = snap.motors.map((m) =>
      m.name + " [" + m.port + "]  pwr " + m.power.toFixed(2) + "  spin " + m.spin.toFixed(2) +
      "  enc " + m.enc + "  " + m.dir).join("\n");
  $("ds").textContent = dsButtonLabel();
}

// ---------- automated checks ----------
const results = [];
function check(name, ok, detail) {
  results.push((ok ? "PASS " : "FAIL ") + name + (detail ? "  -- " + detail : ""));
  $("checks").textContent = results.join("\n");
  log((ok ? "PASS " : "FAIL ") + name + (detail ? " -- " + detail : ""));
  return ok;
}
async function waitFor(pred, timeoutMs) {
  const t0 = performance.now();
  const seq0 = snapSeq + 1; // ignore a snapshot that may have been in flight
  while (performance.now() - t0 < timeoutMs) {
    if (snap && snapSeq > seq0 && pred(snap)) return performance.now() - t0;
    await sleepMs(20);
  }
  return -1;
}
function fpsDuring(fromIdx) {
  const xs = fpsLog.slice(fromIdx);
  if (!xs.length) return "n/a";
  const f = xs.map((x) => x.fps), g = xs.map((x) => x.worstGap);
  return "fps min " + Math.min(...f) + " avg " + Math.round(f.reduce((a, b) => a + b, 0) / f.length) +
      ", worst frame gap " + Math.max(...g) + " ms";
}
async function buildKey(key) {
  await loadPick(key);
  $("pick").value = key;
  return build();
}

async function runAll() {
  results.length = 0;
  // 1. FourMotorTest unedited
  let r = await buildKey("FourMotorTest");
  check("FourMotorTest compiles", r.ok && r.name === "4 Motor Test Routine", "name " + r.name + ", " + timing.lastCompileMs + " ms");
  await J(() => Bridge.init());
  let t = await waitFor((s) => s.state === "INIT" && s.telemetry.includes("FTC MOTOR DIAGNOSTIC"), 5000);
  check("INIT shows telemetry", t >= 0, Math.round(t) + " ms");
  await sleepMs(1500);
  check("waitForStart blocks until PLAY", snap.state === "INIT" && snap.motors.every((m) => m.power === 0));
  const encBefore = snap.motors.map((m) => m.enc);
  const f0 = fpsLog.length;
  await J(() => Bridge.play());
  t = await waitFor((s) => s.state === "RUNNING" && s.telemetry.includes("MOTOR TEST IN PROGRESS"), 3000);
  check("PLAY starts the loop", t >= 0, Math.round(t) + " ms");
  await sleepMs(1000);
  check("FL spins backward at +0.25 (left side, no REVERSE)", snap.motors[0].power === 0.25 && snap.motors[0].spin === -0.25);
  t = await waitFor((s) => s.telemetry.includes("MOTOR TEST COMPLETE!"), 45000);
  const encDelta = snap.motors.map((m, i) => m.enc - encBefore[i]);
  check("FourMotorTest runs to the end (MOTOR TEST COMPLETE!)", t >= 0 && !snap.error, "after ~" + Math.round((t + 1000) / 1000) + " s from PLAY");
  await J(() => Bridge.stop());
  t = await waitFor((s) => s.state === "STOPPED", 3000);
  check("FourMotorTest STOP after complete", t >= 0 && !snap.error, Math.round(t) + " ms");
  check("encoders ~2500 each (0.25 x 5 s x 2000)", encDelta.every((d) => Math.abs(d - 2500) < 150), encDelta.join(", "));
  check("page redraw during run", true, fpsDuring(f0));

  // 2. second compile + STOP timing
  r = await buildKey("StopTest");
  check("second compile", r.ok, timing.lastCompileMs + " ms");
  await J(() => Bridge.init()); await waitFor((s) => s.state === "INIT", 3000);
  await J(() => Bridge.play()); await waitFor((s) => s.state === "RUNNING", 3000);
  await sleepMs(1500);
  const loops = snap.telemetry.join(" ");
  const t1 = performance.now();
  await J(() => Bridge.stop());
  t = await waitFor((s) => s.state === "STOPPED", 6000);
  check("STOP ends OpMode within 1 s", t >= 0 && performance.now() - t1 < 1000, Math.round(performance.now() - t1) + " ms; before STOP: " + loops);
  check("motors zero after STOP", snap.motors.every((m) => m.power === 0));

  // 3. broken copy
  r = await buildKey("Broken");
  const lines = r.problems.map((p) => p.line);
  check("broken copy shows javac errors", !r.ok && r.problems.length === 2 && lines[0] === 90 && lines[1] === 93,
      $("messages").textContent.split("\n").slice(0, 3).join(" / "));

  // 4. MirrorTest
  r = await buildKey("MirrorTest");
  await J(() => Bridge.init()); await waitFor((s) => s.state === "INIT", 3000);
  await J(() => Bridge.play());
  await waitFor((s) => s.telemetry.includes("Phase 1: no REVERSE"), 3000);
  await sleepMs(300);
  const p1 = snap.motors.map((m) => m.spin);
  await waitFor((s) => s.telemetry.includes("Phase 2: left side REVERSE"), 3000);
  await sleepMs(300);
  const p2 = snap.motors.map((m) => m.spin);
  check("MirrorTest phase 1: left back, right forward", p1.join() === "-0.5,0.5,-0.5,0.5", p1.join(", "));
  check("MirrorTest phase 2: all forward", p2.join() === "0.5,0.5,0.5,0.5", p2.join(", ") + "; " + snap.telemetry.join(" / "));
  await J(() => Bridge.stop()); await waitFor((s) => s.state === "STOPPED", 3000);

  // 5. BadNameTest
  r = await buildKey("BadNameTest");
  await J(() => Bridge.init());
  t = await waitFor((s) => s.state === "STOPPED", 3000);
  const want = 'User code threw an uncaught exception: IllegalArgumentException - Unable to find a hardware device with name "frontLeftt" and type DcMotor';
  check("BadNameTest: error text + OpMode stops", t >= 0 && snap.error === want, "Error: " + snap.error);
  check("button back to INIT", dsButtonLabel() === "INIT");

  showTiming();
  log("checks done");
}

async function runStuck(key) {
  const r = await buildKey(key);
  await J(() => Bridge.init()); await waitFor((s) => s.state === "INIT", 3000);
  const f0 = fpsLog.length;
  await J(() => Bridge.play());
  await sleepMs(3000);
  log(key + ": 3 s after PLAY: " + fpsDuring(f0));
  const t1 = performance.now();
  await J(() => Bridge.stop());
  const t = await waitFor((s) => s.error && s.error.indexOf("stuck") >= 0, 15000);
  check(key + ": stuck message after ~5 s", t >= 0, Math.round(performance.now() - t1) + " ms; " + (snap.error || ""));
  check(key + ": motors zeroed", snap.motors.every((m) => m.power === 0));
  check(key + ": page while stuck", true, fpsDuring(f0));
  await sleepMs(500);
  // can a new OpMode still run while the stuck thread lives?
  await buildKey("MirrorTest");
  await J(() => Bridge.init());
  await sleepMs(1000);
  log(key + ": INIT another OpMode afterwards -> state " + snap.state + ", events above");
}

// ---------- timing / network ----------
function showTiming() {
  const res = performance.getEntriesByType("resource");
  const hosts = {};
  let transfer = 0, body = 0;
  for (const e of res) {
    const h = new URL(e.name).host;
    hosts[h] = hosts[h] || { n: 0, transfer: 0, body: 0 };
    hosts[h].n++;
    hosts[h].transfer += e.transferSize || 0;
    hosts[h].body += e.encodedBodySize || 0;
    transfer += e.transferSize || 0;
    body += e.encodedBodySize || 0;
  }
  const mb = (b) => (b / 1048576).toFixed(2) + " MB";
  const out = [
    "browser: " + navigator.userAgent,
    "CheerpJ loader script loaded: " + timing.cdnLoaderMs + " ms after page start",
    "cheerpjInit done: " + timing.initMs + " ms",
    "library (sim.jar) ready: " + timing.libMs + " ms",
    "first compile: " + timing.firstCompileMs + " ms",
    "second compile: " + timing.secondCompileMs + " ms",
    "ready to use (first build done): " + timing.readyMs + " ms",
    "resources: " + res.length + ", transferred " + mb(transfer) + " (0 = from cache), body " + mb(body),
    "  (cross-origin sizes show 0 unless the server sends Timing-Allow-Origin)",
    "domains:",
  ];
  for (const [h, v] of Object.entries(hosts)) out.push("  " + h + "  requests " + v.n + ", transferred " + mb(v.transfer) + ", body " + mb(v.body));
  out.push("fetch/XHR bytes received by the page (includes CheerpJ's runtime downloads; cached responses count too):");
  for (const [h, v] of Object.entries(window.NET)) out.push("  " + h + "  requests " + v.requests + ", " + mb(v.bytes));
  $("timing").textContent = out.join("\n");
}

// ---------- start ----------
async function start() {
  timing.cdnLoaderMs = Math.round(performance.now() - window.T0);
  const ver = JAVA;
  const opts = { version: ver, status: "none" };
  if (params.get("javahome")) opts.javaProperties = ["java.home=" + params.get("javahome")];
  await cheerpjInit(opts);
  timing.initMs = Math.round(performance.now() - window.T0);
  lib = await cheerpjRunLibrary(CP);
  const System = await lib.java.lang.System;
  log("java.version " + (await System.getProperty("java.version")) + ", java.home " + (await System.getProperty("java.home")));
  log("java.class.path " + (await System.getProperty("java.class.path")));
  const TP = await lib.javax.tools.ToolProvider;
  const jc = await TP.getSystemJavaCompiler();
  log("ToolProvider.getSystemJavaCompiler(): " + (jc ? "found" : "NULL"));
  Bridge = await lib.org.nycfirst.opmodesimweb.WebBridge;
  timing.libMs = Math.round(performance.now() - window.T0);
  $("load").textContent = "CheerpJ ready (Java " + ver + ").";
  requestAnimationFrame(frame);
  await loadPick("FourMotorTest");
  await build(); // auto-build once on load
  timing.readyMs = Math.round(performance.now() - window.T0);
  showTiming();
  for (const id of ["build", "ds", "stop", "auto", "autoStuck"]) $(id).disabled = false;
  if (params.get("auto") === "1") await runAll();
}

$("loadBtn").onclick = () => loadPick($("pick").value);
$("build").onclick = () => build();
$("ds").onclick = () => dsPress();
$("stop").onclick = () => J(() => Bridge.stop());
$("auto").onclick = () => runAll();
$("autoStuck").onclick = () => runStuck(params.get("stuck") || "Stuck");
document.addEventListener("visibilitychange", () => log("page visibility: " + document.visibilityState));
window.addEventListener("blur", () => log("window lost focus"));
window.addEventListener("focus", () => log("window got focus"));
window.addEventListener("error", (e) => log("JS error: " + e.message));
window.addEventListener("unhandledrejection", (e) => log("JS error: " + (e.reason && (e.reason.stack || e.reason))));
start().catch((e) => { log("start failed: " + (e && (e.stack || e))); $("load").textContent = "Start failed, see Log."; });
</script>
</body>
</html>
